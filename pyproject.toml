[project]
name = "pacmind-python"
version = "2.0.0"
description = "PAC-MIND: a readable Python game and classical AI search lab"
requires-python = ">=3.10"
dependencies = ["pygame-ce==2.5.7"]

[tool.ruff]
target-version = "py310"
line-length = 96
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
